<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Mon Mini RPG</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Fiche du Personnage</h1>
        <h2>Fiche du Héro</h2>
            <section id="statistiques">
                <p>Nom : <span id = Nom></span></p>
                <p>Force : <span id = force></span></p>
                <p>magie : <span id = magie></span></p>
                <p>Niveau : <span id = Niveau></span></p>
                <p>Classe : <span id = Classe></span></p>
                <p>Pièces : <span id = Pièce></span></p>
                <p>Clé : <span id = Clé></span></p>
                <p>Chapeau : <span id = Chapeau></span></p>
            </section>
        <h2>Combat</h2>
            <button id="btn-fantome">Combattre un fantôme</button>
            <button id="btn-loup">Combattre un loup</button>
        <button id="btn-paladin">Combattre un paladin</button>
        <h2>Marchand</h2>
            <button id="btn-cle">Acheter une Clé</button>
            <button id="btn-chapeau">Acheter un chapeau</button>
        <h2>Boss fight</h2>
            <button id="btn-boss">Combattre le Boss</button>
        <h2>Messages en jeu</h2>
            <p id="Message"></p>


    <script src="index.js"></script>
</body>
</html>
